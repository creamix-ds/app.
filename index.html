<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creamixds — Servicios</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="container">
      <div class="brand">Creamix <span>DS</span></div>
      <nav>
        <a href="#servicios">Servicios</a>
        <a href="#contacto">Contacto</a>
        <a href="/admin">Admin</a>
      </nav>
    </div>
  </header>

  <section class="hero container">
    <h1>Soluciones a medida para tu negocio</h1>
    <p>Conocé nuestros servicios y escribinos: te respondemos a la brevedad.</p>
  </section>

  <section class="container" id="servicios">
    <h2 class="section">Servicios</h2>
    <div class="grid" id="lista-servicios"><div class="empty">Cargando…</div></div>
  </section>

  <section class="container" id="contacto">
    <h2 class="section">Contacto</h2>
    <div class="panel">
      <div id="contacto-alert"></div>
      <form id="form-contacto" autocomplete="on">
        <div class="row">
          <div class="field"><label>Nombre *</label><input name="nombre" required maxlength="100"></div>
          <div class="field"><label>Email *</label><input name="email" type="email" required maxlength="120"></div>
        </div>
        <div class="row">
          <div class="field"><label>Teléfono</label><input name="telefono" maxlength="40"></div>
          <div class="field"><label>Servicio de interés</label>
            <select name="servicio_id"><option value="">— Ninguno en particular —</option></select>
          </div>
        </div>
        <div class="field"><label>Asunto</label><input name="asunto" maxlength="200"></div>
        <div class="field"><label>Mensaje *</label><textarea name="mensaje" required maxlength="5000"></textarea></div>
        <input class="hp" name="website" tabindex="-1" autocomplete="off">
        <button class="btn" type="submit" id="btn-enviar">Enviar mensaje</button>
      </form>
    </div>
  </section>

  <footer>© <span id="anio"></span> Mi Agencia</footer>
  <script src="/form.js"></script>
</body>
</html>
